version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # `astro check` (@astrojs/check) declares a typescript ^5 || ^6 peer
      # range; a TypeScript 7 bump fails `npm ci` until that range widens.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Odd-numbered Node lines never become LTS. Dependabot walks one major at
      # a time, so it offered 25 — already end of life — while 26 was out. The
      # node major moves on the October LTS cadence, in one commit across mise,
      # the workflows and the container so they stay in parity.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Same Node LTS cadence as the Dockerfile above.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
