# Pull request checks. On main, pages.yml runs the same checks before
# deploying.
name: Site

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Site (landing)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Commit dates feed sitemap <lastmod> and dateModified; see pages.yml.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The changelog page and the version label are rendered from the GitHub
      # Releases API at build time; the workflow token lifts the anonymous
      # rate limit so a busy runner IP cannot leave the page empty.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
