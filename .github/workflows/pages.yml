name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The build reads commit dates for sitemap <lastmod> and the
          # structured-data dateModified; a shallow clone would stamp every
          # page with the checkout commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      # vite build does not typecheck, so without this a deploy can ship code
      # that tsc rejects.
      - run: npm run typecheck
      # The changelog page and the version label are rendered from the GitHub
      # Releases API at build time; the workflow token lifts the anonymous
      # rate limit so a busy runner IP cannot leave the page empty.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
